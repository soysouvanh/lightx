[workspace]
members = [
    "lightx",
    "lightx-cli",
    "lightx-test",
    "lightx-macro",
    "lightx-benchmark",
    "lightx-web",
    "lightx-api",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Vincent SOYSOUVANH <vincent.soysouvanh@gmail.com>"]
description = "LightX is a hyper-optimized, production-grade Rust macro-framework. It pioneers a strict Database-First approach and a Zero-Overhead philosophy."
readme = "README.md"
license = "MIT"
repository = "https://github.com/soysouvanh/lightx"
