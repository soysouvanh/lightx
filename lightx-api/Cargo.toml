[package]
name = "lightx-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = ["validation"]
validation = []

[dependencies]
lightx = { path = "../lightx" }
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "sqlite",
    "mysql",
    "postgres",
] }
dotenvy = "0.15"
futures = "0.3.33"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13.1"

[build-dependencies]
daox = { version = "0.2.7", path = "../../daox-workspace/daox", default-features = false, features = [
    "sqlite",
    "postgres",
    "mysql",
] }
lightx = { path = "../lightx" }
tokio = { version = "1.37.0", features = ["full"] }
dotenvy = "0.15"

[dev-dependencies]
lightx-macro = { path = "../lightx-macro" }
