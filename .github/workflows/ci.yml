name: Rust Security Audit & Fuzzing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust Stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Scaffold .env files for CoreGenerator
      run: |
        echo "SQLITE_DATABASE_URL=sqlite::memory:" > lightx-api/.env
        echo "MYSQL_DATABASE_URL=mysql://offline" >> lightx-api/.env
        echo "POSTGRES_DATABASE_URL=postgres://offline" >> lightx-api/.env
        echo "DATABASE_URL=sqlite://offline" > lightx-web/.env
        echo "DATABASE_URL=mysql://offline" > lightx-test/.env
    - name: Run Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Run Tests
      run: cargo test --workspace

  miri-audit:
    name: "Heuristic Shield: Miri UB check"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust Nightly Miri
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    - name: Scaffold .env files for CoreGenerator
      run: |
        echo "SQLITE_DATABASE_URL=sqlite::memory:" > lightx-api/.env
        echo "MYSQL_DATABASE_URL=mysql://offline" >> lightx-api/.env
        echo "POSTGRES_DATABASE_URL=postgres://offline" >> lightx-api/.env
        echo "DATABASE_URL=sqlite://offline" > lightx-web/.env
        echo "DATABASE_URL=mysql://offline" > lightx-test/.env
    - name: Miri Check
      run: cargo miri test --workspace
      env:
        MIRIFLAGS: -Zmiri-disable-isolation

  cargo-audit:
    name: "SecOps: Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Run audit ignoring configured unpatchable upstream vulnerabilities
      run: cargo audit
