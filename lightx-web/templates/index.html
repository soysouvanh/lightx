<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightX Framework - State of the Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8;
            --secondary: #818cf8;
            --bg-base: #020617;
            --bg-card: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-base); 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Subtle background glow effect */
        body::before {
            content: '';
            position: absolute;
            top: -20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.15), transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container { 
            text-align: center; 
            background: rgba(15, 23, 42, 0.6); 
            padding: 60px 50px; 
            border-radius: 20px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1); 
            max-width: 650px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { 
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem; 
            font-weight: 800;
            margin-bottom: 1rem; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            -webkit-background-clip: text; 
            background-clip: text;
            color: transparent; 
            letter-spacing: -0.025em;
        }

        p { 
            font-size: 1.25rem; 
            color: var(--text-muted); 
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        
        strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .links { 
            display: flex; 
            gap: 20px; 
            justify-content: center; 
            flex-wrap: wrap;
        }

        .btn { 
            padding: 14px 28px; 
            border-radius: 12px; 
            font-weight: 600; 
            text-decoration: none; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-primary:hover { 
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.5);
            background: linear-gradient(135deg, #2563eb, #4f46e5);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        /* Micro-animations and floating tags */
        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: inline-block;
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Zéro Allocation &bull; O(1) Routing</div>
        <h1>🚀 LightX Framework</h1>
        <p>Le framework web <strong>State of the Art</strong> ultra-performant écrit en Rust. Propulsé par un routage O(1), de l'AOP statique et notre moteur natif Tmplx.</p>
        
        <div class="links">
            <a href="/dashboard" class="btn btn-primary">Explorer le Dashboard E2E</a>
            <a href="/api/sqlite/db-demo" class="btn btn-outline">API Endpoint (SQLite)</a>
        </div>
    </div>
</body>
</html>
