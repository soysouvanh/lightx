<div class="card">
  <div>
    <strong>{%%= user.pseudo %}</strong>
    ({%%= user.email %}) {% if user.is_admin %}
    <span
      style="
        background: red;
        color: white;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        margin-left: 10px;
      "
      >ADMIN</span
    >
    {% else %}
    <span
      style="
        background: #999;
        color: white;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        margin-left: 10px;
      "
      >USER</span
    >
    {% endif %}
    <br />
    <small style="color: #666">#ID: {%= user.id.to_string() %}</small>
  </div>
  <div style="display: flex; gap: 8px">
    <a
      href="/dashboard/view?id={%= user.id.to_string() %}"
      class="btn btn-info"
      style="padding: 4px 10px"
      >Voir</a
    >
    <a
      href="/dashboard/edit?id={%= user.id.to_string() %}"
      class="btn btn-primary"
      style="padding: 4px 10px"
      >Éditer</a
    >
    <form action="/dashboard/delete" method="POST" style="margin: 0">
      <input type="hidden" name="id" value="{%= user.id.to_string() %}" />
      <button type="submit" class="btn btn-danger" style="padding: 4px 10px">
        X
      </button>
    </form>
  </div>
</div>
