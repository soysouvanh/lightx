[package]
name = "lightx-test"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Integration test suite and starter kit for the LightX framework."
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lightx = { path = "../lightx" }
sqlx = { version = "0.8", features = [
    "mysql",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "uuid",
    "json",
] }
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

[build-dependencies]
lightx = { path = "../lightx" }
dotenvy = "0.15"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
daox = { version = "0.2.0", path = "../../daox-workspace/daox" }
