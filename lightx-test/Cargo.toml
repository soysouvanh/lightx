[package]
name = "lightx-test"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Integration test suite and starter kit for the LightX framework."
license.workspace = true
repository.workspace = true
publish = false
exclude = ["fuzz/"]

[features]
default = ["validation"]
validation = []

[dependencies]
lightx = { path = "../lightx" }
sqlx = { version = "0.9", features = [
    "mysql",
    "sqlite",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "uuid",
    "json",
] }
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
futures = "0.3.33"
regex = "1.13.1"

[build-dependencies]
daox = { version = "0.2.7", path = "../../daox-workspace/daox", default-features = false, features = [
    "sqlite",
    "postgres",
    "mysql",
] }
lightx = { path = "../lightx" }
dotenvy = "0.15"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
